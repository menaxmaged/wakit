name: publish
# Push a tag like v0.1.0 (matching the version in pyproject.toml) to build and publish to PyPI.
# Uses PyPI trusted publishing: no token is stored anywhere.
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: check the tag matches the version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: pip install cryptography && python -m unittest discover -s tests
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wakit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # re-pushing a tag must not fail on files PyPI already has
  release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: GitHub release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a re-pushed tag keeps its release as is: its files are the ones PyPI got the first time
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists - left unchanged"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "wakit $GITHUB_REF_NAME" --generate-notes
          fi
