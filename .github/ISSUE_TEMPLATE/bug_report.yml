name: Bug report
description: Something went wrong or a dry run looks off
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach or paste your chats, databases (`msgstore.db`, `ChatStorage.sqlite`, `*.crypt15`), backups or keys.**
        They contain your private messages. The dry-run output and the error message are enough. Replace any names
        or phone numbers in them with placeholders such as "Alex" or 15551234567.
  - type: input
    id: command
    attributes:
      label: Command
      description: The wakit command you ran, with paths and names replaced by placeholders
      placeholder: wakit import --db msgstore.db --export chat.zip --contact 15551234567
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: What wakit printed (placeholders for names and numbers, please)
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: versions
    attributes:
      label: Versions
      description: wakit (`wakit --version`), WhatsApp, Android / iOS, and your computer's OS
      placeholder: wakit 0.1.0, WhatsApp 2.26.41, Android 14 (rooted) / iOS 18.2, macOS 15
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach any database, backup, export or key, and I replaced names and numbers with placeholders
          required: true
